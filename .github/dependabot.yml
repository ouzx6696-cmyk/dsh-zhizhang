version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Electron stays out of the group: every Electron bump follows the manual upgrade checklist.
      npm-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["electron"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
