name: ci
on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_call:
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.paths.outputs.desktop }}
      package: ${{ steps.paths.outputs.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 2, persist-credentials: false }
      - id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          let files, numstat = '';
          try {
            if (!process.env.BASE_SHA) throw new Error('full verification');
            files = execFileSync('git', ['diff', '--name-only', '-z', process.env.BASE_SHA, 'HEAD'], {encoding:'utf8'}).split('\0');
            numstat = execFileSync('git', ['-c', 'core.quotepath=off', 'diff', '--numstat', '--no-renames', process.env.BASE_SHA, 'HEAD'], {encoding:'utf8'});
          } catch { files = ['package.json']; }
          // PR size rule: source growth without test growth is flagged for review, never blocked.
          let sourceNet = 0, testNet = 0;
          for (const line of numstat.split('\n').filter(Boolean)) {
            const [added, deleted, file] = line.split('\t');
            if (added === '-') continue;
            const net = Number(added) - Number(deleted);
            if (/^test\/|\/tests?\//.test(file)) testNet += net;
            else if (/^(apps|packages)\//.test(file)) sourceNet += net;
          }
          if (sourceNet > 500 && testNet <= 0) console.log(`::warning::源码净增 ${sourceNet} 行，测试净增 ${testNet} 行；请补回归测试或在 PR 中说明原因。`);
          const shared = files.some(p => /^(packages\/|scripts\/|test\/|\.github\/|package(?:-lock)?\.json$|tsconfig)/.test(p));
          const desktop = shared || files.some(p => p.startsWith('apps/desktop/'));
          const pack = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' || process.env.GITHUB_REF.startsWith('refs/tags/');
          appendFileSync(process.env.GITHUB_OUTPUT, `desktop=${desktop || pack}\npackage=${pack}\n`);
          JS
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      # verify never launches Electron, so its binary download is only a failure point here.
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: node scripts/ci-run.mjs npm test
  desktop-ui:
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      # The Electron binary is fetched separately below, behind its cache and a bounded retry.
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - id: electron
        shell: bash
        run: echo "version=$(node -p "require('./node_modules/electron/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}
      # GitHub release downloads occasionally answer 504; retry a few times instead of failing the job.
      - name: 安装 Electron 二进制
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node node_modules/electron/install.js; then exit 0; fi
            echo "::warning::Electron 二进制下载失败（第 $attempt 次）"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - run: node scripts/ci-run.mjs node scripts/test.mjs core
      - run: node scripts/ci-run.mjs npm run test:desktop
      - run: node scripts/ci-run.mjs npm run desktop:build
      - run: node scripts/ci-run.mjs npm run test:desktop:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: desktop-ui-results
          path: test-results/
      - run: node ../../scripts/prepare-desktop-python.mjs && npx electron-builder --win nsis zip --x64 --publish never
        working-directory: apps/desktop
        if: needs.scope.outputs.package == 'true'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: 核对签名并记录发布条件
        if: needs.scope.outputs.package == 'true'
        shell: pwsh
        env:
          CERTIFICATE_PROVIDED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        run: |
          $exe = Get-ChildItem apps/desktop/release/*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $exe.FullName
          if ($env:CERTIFICATE_PROVIDED -eq 'true' -and $signature.Status -ne 'Valid') { throw '签名校验未通过' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          @{ version = $version; commit = $env:GITHUB_SHA; signing = $signature.Status.ToString() } | ConvertTo-Json | Set-Content apps/desktop/release/RELEASE-CONDITIONS.json
          # The GitHub provider uses Release prerelease status, not a channel filename.
          $updateFile = 'latest.yml'
          $expectedVersion = '^version:\s*' + [regex]::Escape($version) + '\s*$'
          if (-not (Select-String -Path "apps/desktop/release/$updateFile" -Pattern $expectedVersion)) { throw '更新清单版本与构建版本不一致' }
          "WRITER_UPDATE_FILE=$updateFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Select-String -Path "apps/desktop/release/$updateFile" -Pattern 'path:.*\.exe')) { throw '更新清单没有引用 NSIS 安装器' }
          $package = Get-ChildItem apps/desktop/release/*.zip | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            foreach ($file in @('WriterAgent.exe', 'resources/app.asar', 'resources/python/python.exe', 'resources/writer/scripts/writer-backup.mjs')) {
              if ($zip.Entries.FullName -notcontains $file) { throw "免安装包缺少 $file" }
            }
          } finally { $zip.Dispose() }
          & apps/desktop/release/win-unpacked/resources/python/python.exe -c "import json; print(json.dumps({'runtime':'ok','text':'中文'},ensure_ascii=False))"
          if ($LASTEXITCODE -ne 0) { throw '随包 Python 无法运行' }
          node scripts/ci-run.mjs node scripts/check-desktop-package.mjs
          if ($LASTEXITCODE -ne 0) { throw '交付客户端启动检查未通过' }
          Write-Output "::notice::Windows 原生 NSIS 和 ZIP 完整；更新清单引用 exe；随包 Python 可运行；签名状态=$($signature.Status)"
      - name: 整理交付文件
        if: needs.scope.outputs.package == 'true'
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          mkdir -p release-artifacts
          cp apps/desktop/release/*.exe apps/desktop/release/*.zip apps/desktop/release/*.blockmap "apps/desktop/release/$WRITER_UPDATE_FILE" apps/desktop/release/RELEASE-CONDITIONS.json release-artifacts/
          cp CHANGELOG.md docs/STATUS.md docs/guides/DESKTOP.md README.md release-artifacts/
          git archive --format=zip --prefix="writer-agent-${version}/" -o "release-artifacts/writer-agent-${version}-src.zip" HEAD
          (cd release-artifacts && sha256sum -- *.zip *.exe *.blockmap *.yml *.json *.md > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.scope.outputs.package == 'true'
        with:
          name: writer-windows-packages
          path: release-artifacts/
