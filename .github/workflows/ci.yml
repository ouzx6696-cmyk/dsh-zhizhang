name: ci
on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_call:
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: npm run check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: npm test

  e2e:
    needs: [check, test]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - id: electron
        shell: bash
        run: echo "version=$(node -p "require('./node_modules/electron/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}
      - name: 安装 Electron 二进制
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node node_modules/electron/install.js; then exit 0; fi
            echo "::warning::Electron 二进制下载失败（第 $attempt 次）"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - run: npm --prefix apps/desktop run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-e2e-results
          path: test-results/

  e2e-linux:
    needs: [check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_registry: https://registry.npmmirror.com
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - name: 准备 Xvfb
        run: |
          if ! command -v xvfb-run; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: 安装 Electron 二进制
        run: |
          for attempt in 1 2 3; do
            if node node_modules/electron/install.js; then exit 0; fi
            echo "::warning::Electron 二进制下载失败（第 $attempt 次）"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - run: npm --prefix apps/desktop run build
      - run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-e2e-results-linux
          path: test-results/

  package:
    needs: [check, test]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: npm ci
      - run: npm run desktop:build
      - run: node scripts/prepare-desktop-python.mjs
      - run: npx electron-builder --win nsis zip --x64 --publish never
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: 核对签名并记录发布条件
        shell: pwsh
        env:
          CERTIFICATE_PROVIDED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        run: |
          $exe = Get-ChildItem apps/desktop/release/*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $exe.FullName
          if ($env:CERTIFICATE_PROVIDED -eq 'true' -and $signature.Status -ne 'Valid') { throw '签名校验未通过' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          @{ version = $version; commit = $env:GITHUB_SHA; signing = $signature.Status.ToString() } | ConvertTo-Json | Set-Content apps/desktop/release/RELEASE-CONDITIONS.json
          $updateFile = 'latest.yml'
          $expectedVersion = '^version:\s*' + [regex]::Escape($version) + '\s*$'
          if (-not (Select-String -Path "apps/desktop/release/$updateFile" -Pattern $expectedVersion)) { throw '更新清单版本与构建版本不一致' }
          "ZHIZHANG_UPDATE_FILE=$updateFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Select-String -Path "apps/desktop/release/$updateFile" -Pattern 'path:.*\.exe')) { throw '更新清单没有引用 NSIS 安装器' }
          $package = Get-ChildItem apps/desktop/release/*.zip | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            foreach ($file in @('Zhizhang.exe', 'resources/app.asar', 'resources/python/python.exe', 'resources/zhizhang/scripts/zhizhang-backup.mjs')) {
              if ($zip.Entries.FullName -notcontains $file) { throw "免安装包缺少 $file" }
            }
          } finally { $zip.Dispose() }
          & apps/desktop/release/win-unpacked/resources/python/python.exe -c "import json; print(json.dumps({'runtime':'ok','text':'中文'},ensure_ascii=False))"
          if ($LASTEXITCODE -ne 0) { throw '随包 Python 无法运行' }
          node scripts/check-desktop-package.mjs
          if ($LASTEXITCODE -ne 0) { throw '交付客户端启动检查未通过' }
          Write-Output "::notice::Windows 原生 NSIS 和 ZIP 完整；更新清单引用 exe；随包 Python 可运行；签名状态=$($signature.Status)"
      - name: 整理交付文件
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          mkdir -p release-artifacts
          cp apps/desktop/release/*.exe apps/desktop/release/*.zip apps/desktop/release/*.blockmap "apps/desktop/release/$ZHIZHANG_UPDATE_FILE" apps/desktop/release/RELEASE-CONDITIONS.json release-artifacts/
          cp CHANGELOG.md docs/STATUS.md docs/USER-GUIDE.md README.md release-artifacts/
          git archive --format=zip --prefix="zhizhang-${version}/" -o "release-artifacts/zhizhang-${version}-src.zip" HEAD
          (cd release-artifacts && sha256sum -- *.zip *.exe *.blockmap *.yml *.json *.md > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zhizhang-windows-packages
          path: release-artifacts/
