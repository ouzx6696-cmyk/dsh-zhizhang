name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npm test
      - run: npm run pack
  dsh-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: mkdir -p ../dshrt && cd ../dshrt && npm init -y && npm i @deepseek-ai/dsh@0.2.1-rc.4 --ignore-scripts
      - run: WRITER_DSH_RUNTIME=$GITHUB_WORKSPACE/../dshrt npm run test:dsh
      - run: WRITER_DSH_RUNTIME=$GITHUB_WORKSPACE/../dshrt npm run test:e2e
      - run: WRITER_DSH_RUNTIME=$GITHUB_WORKSPACE/../dshrt npm run test:e2e:fanqie
