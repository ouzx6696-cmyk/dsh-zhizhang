name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已创建的发行草稿标签，例如 v0.7.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run pack
      - name: 上传并发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          (cd dist-pack && sha256sum "dsh-writer-${version}.tgz" > SHA256SUMS)
          gh release edit "$TAG" --target "$GITHUB_SHA"
          gh release upload "$TAG" "dist-pack/dsh-writer-${version}.tgz" dist-pack/SHA256SUMS
          gh release edit "$TAG" --draft=false --latest
