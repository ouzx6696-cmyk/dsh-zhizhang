name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已创建的发行草稿标签，例如 v0.9.8
        required: true
        type: string
permissions:
  contents: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: writer-windows-packages
          path: release-artifacts
      - name: 上传并发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          test "$(node -p 'require("./package.json").version')" = "$version"
          (cd release-artifacts && sha256sum --check SHA256SUMS)
          if ! gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import path from 'node:path';
          const {version}=JSON.parse(readFileSync('package.json','utf8'));
          const changelog=readFileSync('CHANGELOG.md','utf8');
          const start=changelog.indexOf(`## ${version}`),end=changelog.indexOf('\n## ',start+1);
          if(start<0) throw new Error('发行版本缺少变更记录');
          writeFileSync(path.join(process.env.RUNNER_TEMP,'release-notes.md'),changelog.slice(start,end<0?undefined:end));
          JS
            gh release create "$TAG" --draft --prerelease="$prerelease" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          if ! git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          git fetch --depth=1 --no-tags origin "refs/tags/$TAG"
          tag_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Release 标签指向 $tag_sha，本次构建为 $GITHUB_SHA；请先核对标签。"
            exit 1
          fi
          gh release upload "$TAG" release-artifacts/* --clobber
          if [ "$prerelease" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
