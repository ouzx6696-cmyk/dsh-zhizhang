name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已创建的发行草稿标签，例如 v0.9.2
        required: true
        type: string
permissions:
  contents: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: writer-windows-packages
          path: release-artifacts
      - name: 上传并发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          (cd release-artifacts && sha256sum --check SHA256SUMS)
          gh release edit "$TAG" --target "$GITHUB_SHA"
          gh release upload "$TAG" release-artifacts/* --clobber
          gh release edit "$TAG" --draft=false --latest
