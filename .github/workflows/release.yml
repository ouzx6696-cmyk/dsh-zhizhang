name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已创建的发行草稿标签，例如 v0.9.8
        required: true
        type: string
# No workflow-level grant: verify runs npm install scripts and must never hold a write token.
permissions: {}
jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: writer-windows-packages
          path: release-artifacts
      - name: 上传并发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          test "$(node -p 'require("./package.json").version')" = "$version"
          (cd release-artifacts && sha256sum --check SHA256SUMS)
          if ! gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import path from 'node:path';
          const {version}=JSON.parse(readFileSync('package.json','utf8'));
          const changelog=readFileSync('CHANGELOG.md','utf8');
          const start=changelog.indexOf(`## ${version}`),end=changelog.indexOf('\n## ',start+1);
          if(start<0) throw new Error('发行版本缺少变更记录');
          writeFileSync(path.join(process.env.RUNNER_TEMP,'release-notes.md'),changelog.slice(start,end<0?undefined:end));
          JS
            gh release create "$TAG" --draft --prerelease="$prerelease" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          # Checkout keeps no credentials, so the tag is read through the API; only a 404 means "create it".
          if ! gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2> "$RUNNER_TEMP/tag-lookup.err"; then
            if ! grep -q 'HTTP 404' "$RUNNER_TEMP/tag-lookup.err"; then cat "$RUNNER_TEMP/tag-lookup.err" >&2; exit 1; fi
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          tag_ref="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')"
          tag_sha="${tag_ref#* }"
          if [ "${tag_ref%% *}" = tag ]; then
            tag_sha="$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq .object.sha)"
          fi
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Release 标签指向 $tag_sha，本次构建为 $GITHUB_SHA；请先核对标签。"
            exit 1
          fi
          gh release upload "$TAG" release-artifacts/* --clobber
          if [ "$prerelease" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
