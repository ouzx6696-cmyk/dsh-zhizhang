# dsh-writer：默认两个写作模式入口，DSH 负责会话与 Agent 执行。
# toutiao_enable / fanqie_enable；番茄自动挂载内部小说工作台。
# 本机任务页 /writer；旧 zhizhang_enable 可用 compatibilityEntry: true 显式启用。
# 一个会话一种体裁；原数据目录与作者确认流程保留。
- insert:
    - id: writer
      name: 'dsh-writer'
      config:
        compatibilityEntry: false
        workflow:
          review: quick
          maxAutoRevisionRounds: 2
        zhizhang:
          rootDir: '.zhizhang'
          multiDraftEnabled: false
        rootDir: 'outputs/toutiao'      # 头条数据目录，相对会话工作目录；与 toutiao-viral-writer 4.0.0 兼容
        # storageRoot: 'D:/写作/头条'   # 头条固定绝对目录（设置后忽略 rootDir）
        # python: 'py -3'               # Python 命令；默认自动查找 py -3 / python / python3
        # panel: true                   # 本机写作台，默认开
        # requireEditorPass: false      # 头条：送验收前必须经编辑子代理
        # disabledGates: []             # 可关闭的非锁定门禁
        fanqie:
          # autoMount: true             # 会话里 zhizhang_enable 成功后自动挂上长篇工具与门禁
          # requireEditorPass: false    # 长篇：定稿前必须有"通过"且版本匹配的编辑审读回报
