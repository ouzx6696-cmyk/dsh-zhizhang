appId: local.writer.agent
productName: 写作 Agent
executableName: WriterAgent
artifactName: WriterAgent-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/writer
    to: writer
  - from: resources/python
    to: python
asar: true
publish:
  provider: github
  owner: ouzx6696-cmyk
  repo: dsh-zhizhang
win:
  target: nsis
  icon: branding/icon.ico
  signExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
