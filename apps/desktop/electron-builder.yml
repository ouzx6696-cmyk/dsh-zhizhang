appId: app.zhizhang.desktop
productName: 织章
executableName: Zhizhang
artifactName: Zhizhang-${version}-win-x64.${ext}
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/zhizhang
    to: zhizhang
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
publish:
  provider: github
  owner: ouzx6696-cmyk
  repo: zhizhang
win:
  target: nsis
  icon: branding/icon.ico
  signExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
