appId: local.writer.agent
productName: WriterAgent
artifactName: WriterAgent-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/writer
    to: writer
  - from: resources/python
    to: python
asar: true
win:
  target: nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
